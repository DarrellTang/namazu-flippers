name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'NamazuFlippers/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'NamazuFlippers/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NamazuFlippers/
    env:
      DALAMUD_HOME: /tmp/dalamud
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          wget -q https://goatcorp.github.io/dalamud-distrib/latest.zip -O /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d $DALAMUD_HOME

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --nologo

      - name: Package plugin
        run: |
          mkdir -p ../dist
          cp bin/Release/NamazuFlippers.dll ../dist/
          cp NamazuFlippers.json ../dist/
          (cd ../dist && zip -r ../NamazuFlippers.zip .)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: NamazuFlippers.zip
          draft: false
          prerelease: true
          generate_release_notes: true
