name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'NamazuFlippers/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'NamazuFlippers/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NamazuFlippers/
    env:
      DALAMUD_HOME: /tmp/dalamud
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          wget -q https://goatcorp.github.io/dalamud-distrib/latest.zip -O /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d $DALAMUD_HOME

      - name: Set version
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          VERSION="1.0.${{ github.run_number }}.0"
          TIMESTAMP=$(date +%s)
          echo "Version: $VERSION, Timestamp: $TIMESTAMP"
          # Update plugin manifest
          jq --arg v "$VERSION" '.AssemblyVersion = $v' NamazuFlippers.json > tmp.json && mv tmp.json NamazuFlippers.json
          # Update pluginmaster
          jq --arg v "$VERSION" --arg t "$TIMESTAMP" '.[0].AssemblyVersion = $v | .[0].LastUpdate = $t' ../pluginmaster.json > tmp.json && mv tmp.json ../pluginmaster.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --nologo

      - name: Package plugin
        run: |
          mkdir -p ../dist
          cp -r bin/Release/net10.0-windows/* ../dist/ 2>/dev/null || cp -r bin/Release/* ../dist/
          cp NamazuFlippers.json ../dist/
          (cd ../dist && zip -r ../NamazuFlippers.zip .)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: NamazuFlippers.zip
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../pluginmaster.json NamazuFlippers.json
          git commit -m "chore: bump version to 1.0.${{ github.run_number }}.0" || true
          git push || true
